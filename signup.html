<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Melius Fitness</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    html {
      scroll-behavior: smooth;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #111;
      color: #fff;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background-color: #000;
      padding: 10px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-container img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .logo-container h1 {
      font-size: 1.8rem;
      color: #B20710;
      font-weight: 700;
      letter-spacing: 1px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    nav ul li a {
      color: #fff;
      font-weight: 500;
      transition: color 0.3s ease, border-bottom 0.3s ease;
      padding-bottom: 3px;
    }

    nav ul li a:hover {
      color: #B20710;
      border-bottom: 2px solid #B20710;
    }
    
    .signup-section {
      padding: 80px 20px;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh; 
    }

    .form-container {
      background-color: #1a1a1a;
      padding: 40px;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .form-container h3 {
      font-size: 2rem;
      color: #B20710;
      margin-bottom: 30px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #ccc;
    }

    .form-group input[type="text"], 
    .form-group input[type="email"], 
    .form-group input[type="tel"], 
    .form-group input[type="password"], 
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 5px;
      background-color: #222;
      color: #fff;
      font-size: 1rem;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
      transition: border-color 0.3s;
    }
    
    .form-group input:focus, 
    .form-group select:focus {
        border-color: #B20710;
        outline: none;
    }

    .form-group select {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none; 
        background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23cccccc%22%20d%3D%22M287%20197.35L146.2%2056.65L5.4%20197.35h281.6z%22%2F%3E%3C%2Fsvg%3E');
        background-repeat: no-repeat;
        background-position: right 10px top 50%;
        background-size: 12px auto;
    }

    
    .radio-group { 
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-top: 5px;
    }

    .radio-option {
        display: flex;
        align-items: center;
        background-color: #222;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #333;
        cursor: pointer;
        transition: border-color 0.3s;
    }
    
    .radio-option:hover {
        border-color: #B20710;
    }
    
    .radio-option input[type="checkbox"] {
        margin-right: 15px;
        width: 18px;
        height: 18px;
        accent-color: #B20710; 
    }

    .radio-option label {
        margin-bottom: 0;
        color: #fff;
        font-weight: 400;
    }


    .submit-btn {
      width: 100%;
      background-color: #e50914;
      border: none;
      padding: 15px 0;
      border-radius: 5px;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 20px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .submit-btn:hover {
        background-color: #c90812; 
        transform: scale(1.01);
    }
    


    footer {
      background-color: #000;
      text-align: center;
      padding: 40px 20px;
      color: #888;
      font-size: 0.9rem;
      margin-top: 0; 
    }

    @media (max-width: 768px) {
      header {
        padding: 15px 20px;
      }
      .form-container {
        padding: 30px;
      }
    }
  </style>
</head>

<body>

  <header> 
    <div class="logo-container">
      <img src="images/logo.png" alt="Melius Fitness Logo">
      <h1>Melius Fitness</h1>
    </div>

    <nav>
      <ul>
        <li><a href="index.html#Home">Home</a></li>
        <li><a href="index.html#About">About</a></li>
        <li><a href="index.html#Classes">Classes</a></li>
        <li><a href="index.html#Membership">Membership</a></li>
        <li><a href="index.html#Contact">Contact</a></li>
      </ul>
    </nav>
  </header>
  
  <main>
    <section class="signup-section" id="signup">
      <div class="form-container">
        <h3>Membership Sign-Up</h3>
        <form action="signedup.html" method="GET"> 
          
          <div class="form-group">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="fullName" placeholder="Example: Juan Dela Cruz" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Example: juan.delacruz@email.com" required>
          </div>
          
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Example: +63 912 345 6789" required>
          </div>

          <div class="form-group">
            <label for="plan">Select Membership Plan</label>
            <select id="plan" name="membershipPlan" required>
              <option value="" disabled selected>--- Choose a Plan ---</option>
              <option value="Basic">Basic (₱900.00 / month)</option>
              <option value="Advanced">Advanced (₱1,300.00 / month)</option>
              <option value="Elite">Elite (₱2,600.00 / month)</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Planned Class Attendance (Select All That Apply)</label>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="checkbox" id="strength-class" name="classAttendance" value="Strength Training" checked>
                    <label for="strength-class">Strength Training</label>
                </div>
                <div class="radio-option">
                    <input type="checkbox" id="hiit-class" name="classAttendance" value="HIIT Cardio" checked>
                    <label for="hiit-class">HIIT Cardio</label>
                </div>
                <div class="radio-option">
                    <input type="checkbox" id="yoga-class" name="classAttendance" value="Yoga & Mobility">
                    <label for="yoga-class">Yoga & Mobility</label>
                </div>
            </div>
          </div>
          <div class="form-group">
            <label for="password">Create Password</label>
            <input type="password" id="password" name="password" placeholder="Must be at least 8 characters" required>
          </div>

          <button type="submit" class="submit-btn">Complete Sign-Up</button>
        </form>
      </div>
    </section>
  </main>

  <footer id="contact">
    <p>© 2025 Melius Fitness | Designed by Vincent Salino & David Cardizal</p>
    <p>Email: MeliusFitness@gmail.com | Phone: +63 (965) 805-6962</p>
  </footer>

  <script>
  
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const selectedPlan = urlParams.get('plan');
        const planSelect = document.getElementById('plan');

        if (selectedPlan && planSelect) {
       
            for (let i = 0; i < planSelect.options.length; i++) {
                if (planSelect.options[i].value === selectedPlan) {
                    planSelect.value = selectedPlan;
                    break;
                }
            }
        }
    });
  </script>
</body>
</html>
